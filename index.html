  <style>:root{--bg:#f3f6f5;--card:#fff;--ink:#17211e;--muted:#66746f;--green:#0b5c4a;--green2:#e7f3ee;--line:#dfe8e4;--gold:#b07914;--danger:#a63c3c}
:root.dark{--bg:#101714;--card:#17211d;--ink:#f2f6f4;--muted:#a7b3ae;--green:#58b895;--green2:#203a31;--line:#2d4038;--gold:#e0ad4a;--danger:#e77b7b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.app-header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0}.app-header p{margin:3px 0 0;color:var(--muted);font-size:13px}.icon-btn{border:0;border-radius:12px;background:var(--card);color:var(--ink);padding:10px 12px}.app-main{max-width:820px;margin:auto;padding:16px 16px 104px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;gap:5px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}.bottom-nav button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:11px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:18px}.bottom-nav span{font-size:11px;font-weight:700}.bottom-nav button.active{background:var(--green2);color:var(--green)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.04)}.hero{background:linear-gradient(135deg,var(--green),#178064);color:white}.hero p{color:#eaf7f1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.prayer-card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:15px;text-align:left;color:var(--ink)}.prayer-card strong{display:block;font-size:17px;margin:7px 0 3px}.muted{color:var(--muted);font-size:13px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}.section-title h2{font-size:20px;margin:0}.badge{font-size:12px;border-radius:999px;background:var(--green2);color:var(--green);padding:5px 9px;font-weight:800}.sequence{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:10px 0}.surah-card{min-width:110px;border:1px solid #bddbce;background:var(--green2);color:var(--ink);border-radius:14px;padding:12px;text-align:center;font-weight:800;cursor:pointer}.surah-card small{display:block;margin-bottom:5px;color:var(--muted)}.arrow{color:var(--gold);font-size:21px;font-weight:900}.btn{width:100%;border:0;border-radius:13px;padding:12px 14px;background:var(--green);color:#fff;font-weight:800;margin-top:10px}.btn.secondary{background:var(--green2);color:var(--green)}.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.notice{background:#fff7e7;border-left:4px solid var(--gold);color:#5b461d;padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px}.dark .notice{background:#352b18;color:#f3d99c}.surah-title{font-size:27px;margin:0 0 4px}.arabic{font-family:"Times New Roman",serif;direction:rtl;text-align:right;font-size:29px;line-height:1.9;background:var(--green2);padding:16px;border-radius:14px}.reading{font-size:17px;line-height:1.7}.meaning{font-size:16px;line-height:1.7}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:13px}.tabs button{white-space:nowrap;border:0;border-radius:11px;padding:9px 12px;background:var(--green2);color:var(--green);font-weight:700}.tabs button.active{background:var(--green);color:white}.hidden{display:none!important}.option{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;margin:7px 0}.option.correct{background:#ddf3e6;border-color:#5ea979}.option.wrong{background:#f9e0e0;border-color:#c96969}.progress{height:9px;background:var(--line);border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}table{width:100%;border-collapse:collapse}th,td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}

.audio-panel{background:var(--green2);border:1px solid var(--line);border-radius:15px;padding:13px;margin:14px 0}.audio-main{width:100%;border:0;border-radius:12px;padding:13px;background:var(--green);color:#fff;font-weight:850;font-size:16px}.audio-status{text-align:center;color:var(--muted);font-size:13px;margin:9px 0}.audio-controls{display:flex;justify-content:center;gap:8px}.audio-controls button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 11px;font-weight:700}.audio-controls button.active{background:var(--green);color:white}.audio-progress{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:11px}.audio-progress span{display:block;height:100%;background:var(--green);transition:width .2s linear}

@keyframes popIn{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.bolum-card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.bolum-card .section-title{margin-bottom:8px}
.play-btn{width:100%;border:0;border-radius:13px;padding:12px 14px;background:linear-gradient(135deg,var(--green),#178064);color:#fff;font-weight:800;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.lives{font-size:19px;letter-spacing:2px}
.slot-row{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0}
.slot{flex:1 1 130px;min-height:56px;border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;color:var(--muted);font-size:12px}
.slot small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.slot.filled{border-style:solid;border-color:#5ea979;background:#ddf3e6;color:var(--ink);font-weight:800;animation:popIn .25s ease;cursor:pointer}
.dark .slot.filled{background:#1e3a2c;border-color:#4f9f76}
.chip-tray{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}
.chip{border:1px solid #bddbce;background:var(--green2);color:var(--ink);border-radius:14px;padding:13px 15px;font-weight:800;cursor:pointer}
.chip.wrong{animation:shakeX .4s;border-color:var(--danger);background:#f9e0e0}
.chip.placed{display:none}
.result-panel{text-align:center;padding:8px}
.result-stat{display:flex;justify-content:center;gap:22px;margin:14px 0;color:var(--muted);font-size:13px}
.result-stat b{display:block;color:var(--ink);font-size:19px}
.xp-row{display:flex;align-items:center;gap:9px;margin-top:6px}
.xp-row .progress{flex:1}
.level-pill{background:var(--green);color:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;white-space:nowrap}
</style>

 plans:[

  {id:'yatsi_farz',vakit:'Yatsı',bolum:'4 Rekât Farz',icon:'🌙',sureler:['kafirun','nasr']},

  {id:'vitir',vakit:'Vitir',bolum:'3 Rekât',icon:'⭐',sureler:['ala','kafirun','ihlas']}
 ],
 surahs:{
  kafirun:{number:109,name:'Kâfirûn',arabic:'قُلْ يَا أَيُّهَا الْكَافِرُونَ ۝ لَا أَعْبُدُ مَا تَعْبُدُونَ ۝ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ ۝ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ لَكُمْ دِينُكُمْ وَلِيَ دِينِ',reading:'Kul yâ eyyühel kâfirûn. Lâ a‘büdü mâ ta‘büdûn. Velâ entüm âbidûne mâ a‘büd. Velâ ene âbidün mâ abedtüm. Velâ entüm âbidûne mâ a‘büd. Leküm dînüküm veliye dîn.',meaning:'De ki: Ey inkâr edenler! Ben sizin kulluk ettiklerinize kulluk etmem. Siz de benim kulluk ettiğime kulluk etmezsiniz. Ben sizin kulluk ettiklerinize kulluk edecek değilim. Siz de benim kulluk ettiğime kulluk edecek değilsiniz. Sizin dininiz size, benim dinim banadır.'},
  ihlas:{number:112,name:'İhlâs',arabic:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ',reading:'Kul hüvallâhü ehad. Allâhüssamed. Lem yelid ve lem yûled. Ve lem yekün lehû küfüven ehad.',meaning:'De ki: O Allah birdir. Allah sameddir; her şey O’na muhtaçtır, O hiçbir şeye muhtaç değildir. Doğurmamış ve doğmamıştır. Hiçbir şey O’na denk değildir.'},
  fil:{number:105,name:'Fîl',arabic:'أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ ۝ أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ ۝ وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ ۝ تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ ۝ فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ',reading:'Elem tera keyfe feale rabbüke bi-ashâbil fîl. Elem yec‘al keydehüm fî tadlîl. Ve ersele aleyhim tayran ebâbîl. Termîhim bi-hicâratin min siccîl. Fecealehüm ke’asfin me’kûl.',meaning:'Rabbinin fil sahiplerine ne yaptığını görmedin mi? Onların planlarını boşa çıkarmadı mı? Üzerlerine sürü sürü kuşlar gönderdi. Kuşlar onlara pişmiş balçıktan taşlar atıyordu. Sonunda onları yenilmiş ekin yaprakları gibi yaptı.'},
  kureys:{number:106,name:'Kureyş',arabic:'لِإِيلَافِ قُرَيْشٍ ۝ إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ ۝ فَلْيَعْبُدُوا رَبَّ هَذَا الْبَيْتِ ۝ الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ',reading:'Li îlâfi Kureyş. Îlâfihim rihleteş şitâi vessayf. Felya‘büdû rabbe hâzel beyt. Ellezî et‘amehüm min cûin ve âmenehüm min havf.',meaning:'Kureyş’in güvenliği, kış ve yaz yolculuklarındaki güvenlikleri için, kendilerini açlıktan doyuran ve korkudan güvene kavuşturan bu evin Rabbine kulluk etsinler.'},
  maun:{number:107,name:'Mâûn',arabic:'أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ ۝ فَذَلِكَ الَّذِي يَدُعُّ الْيَتِيمَ ۝ وَلَا يَحُضُّ عَلَى طَعَامِ الْمِسْكِينِ ۝ فَوَيْلٌ لِلْمُصَلِّينَ ۝ الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ ۝ الَّذِينَ هُمْ يُرَاءُونَ ۝ وَيَمْنَعُونَ الْمَاعُونَ',reading:'Eraeytellezî yükezzibü biddîn. Fezâlikellezî yedu‘ul yetîm. Velâ yehuddu alâ taâmil miskîn. Feveylün lil musallîn. Ellezîne hüm an salâtihim sâhûn. Ellezîne hüm yürâûn. Ve yemneûnel mâûn.',meaning:'Dini yalanlayanı gördün mü? İşte o, yetimi itip kakar; yoksulu doyurmaya teşvik etmez. Namazlarını ciddiye almayan, gösteriş yapan ve küçük yardımları esirgeyenlerin vay hâline.'},
  kevser:{number:108,name:'Kevser',arabic:'إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ۝ فَصَلِّ لِرَبِّكَ وَانْحَرْ ۝ إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ',reading:'İnnâ a‘taynâkel kevser. Fesalli lirabbike venhar. İnne şânieke hüvel ebter.',meaning:'Şüphesiz sana Kevser’i verdik. O hâlde Rabbin için namaz kıl ve kurban kes. Asıl soyu kesik olan, sana kin duyandır.'},
  nasr:{number:110,name:'Nasr',arabic:'إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ ۝ وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا ۝ فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا',reading:'İzâ câe nasrullâhi velfeth. Ve raeytennâse yedhulûne fî dînillâhi efvâcâ. Fesebbih bihamdi rabbike vestağfirh. İnnehû kâne tevvâbâ.',meaning:'Allah’ın yardımı ve fetih geldiğinde, insanların bölük bölük Allah’ın dinine girdiğini gördüğünde Rabbini överek tesbih et ve O’ndan bağışlanma dile. Çünkü O, tövbeleri çok kabul edendir.'},
  tebbet:{number:111,name:'Tebbet (Leheb)',arabic:'تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ ۝ مَا أَغْنَى عَنْهُ مَالُهُ وَمَا كَسَبَ ۝ سَيَصْلَى نَارًا ذَاتَ لَهَبٍ ۝ وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ ۝ فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ',reading:'Tebbet yedâ ebî lehebin ve tebb. Mâ ağnâ anhü mâlühû ve mâ keseb. Seyaslâ nâran zâte leheb. Vemraetühû hammâletel hatab. Fî cîdihâ hablün min mesed.',meaning:'Ebû Leheb’in elleri kurusun; zaten kurudu. Malı ve kazandıkları ona fayda vermedi. O, alevli bir ateşe girecek; odun taşıyan karısı da. Boynunda bükülmüş liften bir ip olacaktır.'},
  felak:{number:113,name:'Felak',arabic:'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ',reading:'Kul eûzü birabbil felak. Min şerri mâ halak. Ve min şerri gâsikın izâ vekab. Ve min şerrin neffâsâti fil ukad. Ve min şerri hâsidin izâ hased.',meaning:'De ki: Yarattıklarının şerrinden, karanlığı çöktüğünde gecenin şerrinden, düğümlere üfleyenlerin şerrinden ve kıskandığında kıskancın şerrinden sabahın Rabbine sığınırım.'},
  nas:{number:114,name:'Nâs',arabic:'قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ',reading:'Kul eûzü birabbinnâs. Melikinnâs. İlâhinnâs. Min şerril vesvâsil hannâs. Ellezî yüvesvisü fî sudûrinnâs. Minel cinneti vennâs.',meaning:'De ki: İnsanların Rabbine, insanların hükümdarına, insanların ilâhına; insanların kalplerine vesvese veren, sonra sinip geri çekilen cin ve insan şeytanlarının şerrinden sığınırım.'},
  ala:{number:87,name:'A‘lâ',arabic:'سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى ۝ الَّذِي خَلَقَ فَسَوَّى ۝ وَالَّذِي قَدَّرَ فَهَدَى ۝ وَالَّذِي أَخْرَجَ الْمَرْعَى ۝ فَجَعَلَهُ غُثَاءً أَحْوَى',reading:'Sebbihisme rabbikel a‘lâ. Ellezî haleka fesevvâ. Vellezî kaddere fehedâ. Vellezî ahracel mer‘â. Fecealehû gusâen ahvâ…',meaning:'Yüce Rabbinin adını tesbih et. O, yaratıp düzenleyen; ölçü koyup yol gösteren; otlağı çıkarıp sonra onu kapkara kuru çöpe çevirendir. (Bu ekranda sûrenin ilk bölümü özetlenmiştir.)'}
 }
};

const AUDIO_SOURCES=[
 n=>`https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/${n}.mp3`,
 n=>`https://server8.mp3quran.net/afs/${n}.mp3`
];

const app=document.getElementById('app');
function sName(id){return D.surahs[id]?.name||id}
function navActive(r){document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===r))}
function go(r,param){if(route==='surah'&&r!=='surah')stopAudio();if(DETAIL_ROUTES.includes(r)&&!DETAIL_ROUTES.includes(route))detailOrigin={route,param:curParam};route=r;curParam=param;if(MAIN_ROUTES.includes(r))navActive(r);render(r,param);window.scrollTo({top:0,behavior:'smooth'})}

function seq(plan){return `<div class="sequence">${plan.sureler.map((id,i)=>`<button class="surah-card" onclick="go('surah','${id}')"><small>${i+1}. rekât</small>${sName(id)}</button>${i<plan.sureler.length-1?'<span class="arrow">→</span>':''}`).join('')}</div>`}

/* ---- Zincirler ----
   Sıra sıra ezberlemek yerine tek bir bütün olarak öğrenmek için, bölümleri
   üç kademeye topluyoruz:
   0) Kısa Sûreler Sırası — uygulamada geçen 11 farklı sûrenin kendi
      aralarındaki doğal (Kur'an) sırası, tek zincir.
   1) Vakit zincirleri — bir vaktin bütün rekâtlarındaki sûreler uç uca
      eklenmiş tek zincir (ör. Öğle: İlk Sünnet+Farz+Son Sünnet birlikte).
   2) Günün Tam Sırası — bütün vakitlerin zincirleri uç uca eklenmiş, günün
      baştan sona tek büyük sırası. Yalnızca 1. kademedeki 6 zincir yeterince
      pekiştirilince açılır. */
function buildChains(){
 const vakitOrder=[...new Map(D.plans.map(p=>[p.vakit,p])).keys()];
 const tier1=vakitOrder.map(v=>{
  const parts=D.plans.filter(p=>p.vakit===v);
  return {id:'v_'+v,title:v,icon:parts[0].icon,tier:1,
   items:parts.flatMap(p=>p.sureler.map(id=>({id,group:p.bolum})))};
 });
 const master={id:'master',title:'Kısa Sûreler Sırası',icon:'📖',tier:0,
  items:Object.entries(D.surahs).sort((a,b)=>a[1].number-b[1].number).map(([id])=>({id,group:null}))};
 const gun={id:'gun',title:'Günün Tam Sırası',icon:'🌐',tier:2,
  items:tier1.flatMap(c=>c.items.map(it=>({id:it.id,group:`${c.title} · ${it.group}`})))};
 return [master,...tier1,gun];
}
const CHAINS=buildChains();
function chainById(id){return CHAINS.find(c=>c.id===id)}
function chainLocked(chain){
 if(chain.tier===0)return false;
 if(chain.tier===1)return !(state.cards.master&&state.cards.master.box>=1);
 return !CHAINS.filter(c=>c.tier===1).every(c=>state.cards[c.id]&&state.cards[c.id].box>=2);
}
function cardLabel(chain){
 if(chainLocked(chain))return '🔒 Kilitli';
 const c=state.cards[chain.id];
 if(!c)return '🆕 Yeni';
 if(c.box>=6)return '🏆 Ustalaştı';
 if(c.due<=today())return '⏰ Bugün tekrar';
 return `📦 Kutu ${c.box} · ${fmtDate(c.due)}`;
}
function renderHome(){
 const vakitler=[...new Map(D.plans.map(p=>[p.vakit,p])).values()];
 const dueN=studyDueCount();
 app.innerHTML=`<section class="card hero"><h2>🔥 ${state.streak.count} günlük seri</h2><p>${dueN?`Bugün ${dueN} zincir çalışmanı bekliyor.`:'Bugün için planlanan tekrar yok, harikasın!'}</p><button class="btn secondary" style="margin-top:10px" onclick="go('study')">${dueN?'▶ Çalış':'🔁 Serbest pratik'}</button></section><div class="grid">${vakitler.map(v=>`<button class="prayer-card" onclick="go('prayer','${v.vakit}')"><span>${v.icon}</span><strong>${v.vakit}</strong><span class="muted">${D.plans.filter(p=>p.vakit===v.vakit).length} bölüm</span></button>`).join('')}</div>`;
}
function renderPrayer(vakit){
 const chain=chainById('v_'+vakit);
 const parts=D.plans.filter(p=>p.vakit===vakit);
 app.innerHTML=`<button class="btn ghost" onclick="go('home')">← Ana sayfa</button>
 <div class="section-title"><h2>${parts[0].icon} ${vakit}</h2><span class="badge">${cardLabel(chain)}</span></div>
 <p class="muted">Bu vaktin bütün rekâtlarındaki sûreler, Çalış sekmesinde tek zincir olarak pekiştirilir. Aşağıda bölüm bölüm okuyabilirsin.</p>
 ${parts.map(p=>`<section class="card"><h3 class="muted" style="margin:0 0 8px">${p.bolum}</h3>${seq(p)}</section>`).join('')}`;
}
function renderOverview(){
 const chainRows=CHAINS.map(c=>`<div class="section-title"><span class="muted">${c.icon} ${c.title}${c.tier?` (${c.items.length} adım)`:''}</span><span class="badge">${cardLabel(c)}</span></div>`).join('');
 app.innerHTML=`<section class="card"><div class="section-title"><h2>Zincir durumu</h2></div>${chainRows}</section>
 <section class="card"><div class="section-title"><h2>Ayrıntılı sıra</h2><span class="badge">Tüm vakitler</span></div><table><thead><tr><th>Vakit / bölüm</th><th>Sûre sırası</th></tr></thead><tbody>${D.plans.map(p=>`<tr><td><b>${p.icon} ${p.vakit}</b><br><span class="muted">${p.bolum}</span></td><td>${p.sureler.map((x,i)=>`<button class="surah-card" style="min-width:auto;padding:7px 9px;margin:2px" onclick="go('surah','${x}')">${i+1}. ${sName(x)}</button>`).join(' ')}</td></tr>`).join('')}</tbody></table></section>`;
}
function renderSurah(id){
 const s=D.surahs[id]; stopAudio(false);
 app.innerHTML=`<button class="btn ghost" onclick="detailBack()">← Geri</button>
 <section class="card"><h2 class="surah-title">${s.name} Sûresi</h2><p class="muted">Arapça metin, Türkçe okunuş, anlam ve sesli okuyuş</p>
 <div class="audio-panel">
   <audio id="surahAudio" controls playsinline preload="metadata" style="width:100%"></audio>
   <div class="audio-status" id="audioStatus">Ses yükleniyor…</div>
   <div class="audio-controls">
     <button onclick="restartSurahAudio('${id}')">↺ Baştan</button>
     <button class="speed active" data-rate="1" onclick="setAudioRate(this,1)">1×</button>
     <button class="speed" data-rate="0.75" onclick="setAudioRate(this,.75)">0,75×</button>
   </div>
   <a id="audioFallback" class="btn ghost" target="_blank" rel="noopener" style="margin-top:10px">Ses kaynağını ayrı aç</a>
 </div>
 <div class="tabs"><button class="active" onclick="tab(this,'arabicTab')">Arapça</button><button onclick="tab(this,'readingTab')">Okunuş</button><button onclick="tab(this,'meaningTab')">Anlam</button></div>
 <div id="arabicTab" class="tab-pane arabic">${s.arabic}</div><div id="readingTab" class="tab-pane reading hidden">${s.reading}</div><div id="meaningTab" class="tab-pane meaning hidden">${s.meaning}</div></section>
 <section class="notice">Türkçe okunuş yalnızca yardımcıdır. Sesli okuyuş çevrim içi Kur’an ses servisinden alınır.</section>`; setTimeout(()=>loadSurahAudio(id),0)}
function loadSurahAudio(id){
 const s=D.surahs[id];
 if(!s?.number) throw new Error('Sûre numarası bulunamadı.');
 const n=String(s.number).padStart(3,'0');
 audioState.tracks=AUDIO_SOURCES.map(f=>f(n));audioState.index=0;audioState.surahId=id;
 const audio=document.getElementById('surahAudio');
 if(!audio)return;
 audio.playbackRate=audioState.rate; audioState.audio=audio;
 audio.oncanplay=()=>setAudioStatus('Ses hazır. Oynat düğmesine dokun.');
 audio.onloadstart=()=>setAudioStatus('Ses yükleniyor…');
 audio.onplay=()=>setAudioStatus('Oynatılıyor.');
 audio.onpause=()=>{if(!audio.ended)setAudioStatus('Duraklatıldı.');};
 audio.onended=()=>setAudioStatus('Sûre tamamlandı.');
 audio.onerror=()=>{
  if(audioState.index<audioState.tracks.length-1){audioState.index++;setAudioStatus('Bu kaynak açılmadı, başka bir sunucu deneniyor…');playCurrentTrack()}
  else setAudioStatus('Ses hiçbir kaynaktan yüklenemedi. “Ses kaynağını ayrı aç” düğmesini dene.');
 };
 playCurrentTrack();
}
function playCurrentTrack(){
 const audio=audioState.audio;const url=audioState.tracks[audioState.index];
 const fallback=document.getElementById('audioFallback');
 if(!audio||!url)return;
 audio.src=url;
 if(fallback)fallback.href=url;
}
function setAudioStatus(text){const el=document.getElementById('audioStatus');if(el)el.textContent=text}
function toggleSurahAudio(id){
 const audio=document.getElementById('surahAudio');
 if(!audioState.surahId)loadSurahAudio(id);
 const a=audioState.audio||audio;
 if(!a)return;
 if(a.paused)a.play().catch(()=>setAudioStatus('iPhone yerel dosya güvenliği sesi engelledi. Alttaki bağlantıyla aç.'));else a.pause();
}
function restartSurahAudio(id){const a=audioState.audio||document.getElementById('surahAudio');if(!a){loadSurahAudio(id);return}a.currentTime=0;a.play().catch(()=>setAudioStatus('Ses ayrı bağlantıda açılmalı.'))}
function setAudioRate(btn,rate){audioState.rate=rate;if(audioState.audio)audioState.audio.playbackRate=rate;document.querySelectorAll('.speed').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function stopAudio(clear=true){if(audioState.audio){audioState.audio.pause()}audioState.audio=null;audioState.playing=false;if(clear){audioState.tracks=[];audioState.index=0;audioState.surahId=null}}
function tab(btn,id){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.tab-pane').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function xpToLevel(xp){return {level:1+Math.floor(xp/100),inLevel:xp%100}}

/* ---- Aralıklı tekrar (Leitner kutu) motoru ----
   Kutu 0-6, her kutunun bir bekleme süresi var. Bir zinciri hatasız
   tamamlarsan bir üst kutuya çıkar ve tekrar tarihi uzar; hata yaparsan
   bir alt kutuya iner ve yakında tekrar karşına çıkar. Yeni zincirler
   güne 2 adetle sınırlı tanıtılır, aşırı yüklenmeyi önlemek için. */
const BOX_INTERVALS=[0,1,2,4,7,14,30];
const DAILY_NEW_LIMIT=2;
function today(){return new Date().toISOString().slice(0,10)}
function daysFromNow(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}
function availableChains(){return CHAINS.filter(c=>!chainLocked(c))}
function newList(){return availableChains().filter(c=>!state.cards[c.id])}
function dueList(){return availableChains().filter(c=>{const cd=state.cards[c.id];return cd&&cd.due<=today()})}
function newQuotaLeft(){return Math.max(0,DAILY_NEW_LIMIT-(state.newToday.date===today()?state.newToday.count:0))}
function studyDueCount(){return dueList().length+Math.min(newQuotaLeft(),newList().length)}
function introduceToday(){
 if(state.newToday.date!==today())state.newToday={date:today(),count:0};
 const room=newQuotaLeft();
 if(room<=0)return[];
 const fresh=newList().slice(0,room);
 fresh.forEach(c=>{state.cards[c.id]={box:0,due:today(),lapses:0}});
 state.newToday.count+=fresh.length;
 return fresh;
}
function buildQueue(){
 const fresh=introduceToday();
 const freshIds=new Set(fresh.map(c=>c.id));
 const due=dueList();
 Store.set(state);
 const tasks=due.map(c=>({chain:c,stage:freshIds.has(c.id)?'A':(state.cards[c.id].box<=2?'B':'C')}));
 return shuffle(tasks);
}
function updateStreak(){
 const t=today();
 if(state.streak.last===t)return;
 state.streak.count=state.streak.last===daysFromNow(-1)?state.streak.count+1:1;
 state.streak.last=t;
 Store.set(state);
}
function beginStudySession(practiceMode){
 let tasks;
 if(practiceMode){
  const introduced=availableChains().filter(c=>state.cards[c.id]);
  tasks=shuffle(introduced.map(c=>({chain:c,stage:state.cards[c.id].box<=2?'B':'C'})));
 }else{
  tasks=buildQueue();
 }
 if(!tasks.length){
  app.innerHTML=`<section class="card result-panel">
  <h2>🤔 Şu an çalışılacak zincir yok</h2>
  <p class="muted">Bu genelde eski bir tarayıcı durumundan kaynaklanır. İlerleme sekmesinden "Tüm ilerlemeyi sıfırla" ile temiz başlayabilirsin.</p>
  <button class="btn" onclick="go('progress')">İlerlemeye git</button>
  <button class="btn secondary" onclick="go('study')">Geri dön</button>
  </section>`;
  return;
 }
 studySession={queue:tasks,idx:0,promoted:0,demoted:0,xp:0,practice:practiceMode};
 renderStudy();
}
function chainListHtml(){
 return CHAINS.map(c=>`<div class="section-title"><span class="muted">${c.icon} ${c.title}</span><span class="badge">${cardLabel(c)}</span></div>`).join('');
}
function renderStudy(){
 if(!studySession){
  const dueN=dueList().length,newN=Math.min(newQuotaLeft(),newList().length),total=dueN+newN;
  const anyIntroduced=availableChains().some(c=>state.cards[c.id]);
  app.innerHTML=`<section class="card hero"><h2>🔥 ${state.streak.count} günlük seri</h2>
  <p>${total?`Bugün ${total} zincir seni bekliyor: ${newN} yeni, ${dueN} tekrar.`:'Bugün için planlanan tekrar yok. Harika gidiyorsun! 🎉'}</p></section>
  <section class="card">${total?`<button class="play-btn" onclick="beginStudySession(false)">▶ Bugün Çalış (${total})</button>`:anyIntroduced?`<button class="play-btn" onclick="beginStudySession(true)">🔁 Serbest pratik yap</button>`:`<p class="muted">Başlamak için Bugün Çalış'a bas, önce Kısa Sûreler Sırası tanıtılsın.</p><button class="play-btn" onclick="beginStudySession(false)">▶ Başla</button>`}</section>
  <section class="card"><h2>Zincirler</h2><p class="muted">Önce kısa sûrelerin doğal sırası, sonra her vaktin kendi zinciri, en son hepsi birleşip günün tam sırası olur.</p>${chainListHtml()}</section>`;
  return;
 }
 if(studySession.idx>=studySession.queue.length){renderStudySummary();return}
 const task=studySession.queue[studySession.idx];
 if(task.stage==='A')renderStageA(task);else renderDrill(task);
}
function renderStageA(task){
 const c=task.chain;
 let lastGroup=undefined,html='<div class="slot-row">';
 c.items.forEach((it,i)=>{
  if(it.group!==lastGroup){if(i>0)html+='</div>';if(it.group)html+=`<p class="muted" style="margin:14px 0 4px;font-weight:800;width:100%">${it.group}</p>`;html+='<div class="slot-row">';lastGroup=it.group;}
  html+=`<button class="slot filled" onclick="go('surah','${it.id}')"><small>${i+1}</small>${sName(it.id)}</button>`;
 });
 html+='</div>';
 app.innerHTML=`<section class="card">
 <span class="badge">🆕 Yeni zincir · ${studySession.idx+1}/${studySession.queue.length}</span>
 <h2 class="surah-title">${c.icon} ${c.title}</h2>
 <p class="muted">${c.items.length} adımlık bu sırayı birkaç kez oku, sonra hemen deneyeceksin:</p>
 ${html}
 <button class="btn" onclick="advanceStudy()">Hazırım, sırala →</button>
 </section>`;
}
function advanceStudy(){studySession.queue[studySession.idx].stage='B';drill=null;renderStudy()}
function poolFor(task){
 const targetIds=task.chain.items.map(it=>it.id);
 if(task.stage==='C'){
  const universe=chainById('master').items.map(it=>it.id);
  const distractors=shuffle(universe.filter(id=>!targetIds.includes(id))).slice(0,4);
  return shuffle([...targetIds,...distractors]);
 }
 return shuffle(targetIds);
}
function renderDrill(task){
 if(!drill||drill.taskId!==task.chain.id||drill.stage!==task.stage)drill={taskId:task.chain.id,stage:task.stage,pool:poolFor(task),placedIdx:[],mistakes:0,lives:3};
 const c=task.chain,expectedIds=c.items.map(it=>it.id);
 app.innerHTML=`<section class="card">
 <div class="game-top"><span class="badge">${task.stage==='C'?'🧠 Hatırla':'🧩 Diz'} · ${studySession.idx+1}/${studySession.queue.length}</span><span class="lives">${'❤️'.repeat(drill.lives)}${'🤍'.repeat(3-drill.lives)}</span></div>
 <h2 class="surah-title">${c.icon} ${c.title}</h2>
 <p class="muted">${task.stage==='C'?'Doğru sûreleri, aralarına karışan başkalarından ayırarak sırayla seç.':'Sûreleri baştan sona doğru sırayla tıkla.'}</p>
 <div class="slot-row">${expectedIds.map((id,i)=>i<drill.placedIdx.length?`<button class="slot filled" onclick="go('surah','${drill.pool[drill.placedIdx[i]]}')"><small>${i+1}</small>${sName(drill.pool[drill.placedIdx[i]])}</button>`:`<div class="slot"><small>${i+1}</small>?</div>`).join('')}</div>
 <div class="chip-tray">${drill.pool.map((id,i)=>`<button class="chip ${drill.placedIdx.includes(i)?'placed':''}" id="dchip${i}" onclick="pickDrillChip(${i})">${sName(id)}</button>`).join('')}</div>
 </section>`;
}
function pickDrillChip(i){
 if(!drill)return;
 const task=studySession.queue[studySession.idx];
 if(drill.placedIdx.includes(i))return;
 const expectedIds=task.chain.items.map(it=>it.id);
 const expected=expectedIds[drill.placedIdx.length];
 if(drill.pool[i]===expected){
  drill.placedIdx.push(i);
  if(drill.placedIdx.length===expectedIds.length){finishDrill(task);return}
  renderDrill(task);
 }else{
  drill.mistakes++;drill.lives--;
  const chip=document.getElementById(`dchip${i}`);
  if(chip){chip.classList.add('wrong');setTimeout(()=>chip.classList.remove('wrong'),400)}
  if(drill.lives<=0){finishDrill(task,true);return}
  renderDrill(task);
 }
}
function finishDrill(task,failed){
 const c=task.chain,success=!failed&&drill.mistakes===0;
 if(!studySession.practice){
  const cd=state.cards[c.id]||(state.cards[c.id]={box:0,due:today(),lapses:0});
  if(success){cd.box=Math.min(cd.box+1,BOX_INTERVALS.length-1);studySession.promoted++}
  else{cd.box=Math.max(cd.box-1,0);cd.lapses++;studySession.demoted++}
  cd.due=daysFromNow(BOX_INTERVALS[cd.box]);
 }
 const gained=success?10+c.items.length*3:4+c.items.length;
 state.xp+=gained;studySession.xp+=gained;
 Store.set(state);
 drill=null;studySession.idx++;
 renderStudyStepResult(c,success,gained,failed);
}
function renderStudyStepResult(c,success,gained,failed){
 const cd=state.cards[c.id];
 app.innerHTML=`<section class="card result-panel">
 <h2>${failed?'😵 Bu sefer olmadı':success?'✅ Harika!':'🙂 Tekrar gerekecek'}</h2>
 <p class="muted">${c.icon} ${c.title}</p>
 ${failed?`<p class="muted">Doğru sıra:</p><div class="slot-row">${c.items.map((it,i)=>`<button class="slot filled" onclick="go('surah','${it.id}')"><small>${i+1}</small>${sName(it.id)}</button>`).join('')}</div>`:''}
 ${!studySession.practice&&cd?`<p>Kutu <b>${cd.box}</b>/6 · Sıradaki tekrar: <b>${fmtDate(cd.due)}</b></p>`:''}
 <p class="muted">+${gained} XP</p>
 <button class="btn" onclick="renderStudy()">Devam et →</button>
 </section>`;
}
function renderStudySummary(){
 updateStreak();
 const {level}=xpToLevel(state.xp),{queue,promoted,xp,practice}=studySession;
 app.innerHTML=`<section class="card result-panel">
 <h2>Bugünkü çalışma bitti 🎉</h2>
 <div class="result-stat"><div><b>${queue.length}</b>zincir</div><div><b>${practice?'—':promoted}</b>ilerledi</div><div><b>+${xp}</b>XP</div></div>
 <p class="muted">Seviye ${level} · 🔥 ${state.streak.count} günlük seri</p>
 <button class="btn" onclick="studySession=null;go('study')">Bitir</button>
 </section>`;
 studySession=null;
}
function renderProgress(){
 const total=CHAINS.length;
 const cards=CHAINS.map(c=>state.cards[c.id]).filter(Boolean);
 const mastered=cards.filter(c=>c.box>=6).length;
 const dueN=dueList().length;
 const boxCounts=[0,1,2,3,4,5,6].map(b=>cards.filter(c=>c.box===b).length);
 const {level,inLevel}=xpToLevel(state.xp);
 app.innerHTML=`<section class="card">
 <div class="section-title"><h2>İlerleme</h2><span class="level-pill">Seviye ${level}</span></div>
 <div class="xp-row"><div class="progress"><span style="width:${inLevel}%"></span></div><span class="muted">${inLevel}/100 XP</span></div>
 </section>
 <section class="card"><h2>${cards.length}/${total} zincir tanıtıldı</h2><div class="progress"><span style="width:${total?Math.round(cards.length/total*100):0}%"></span></div><p class="muted">🏆 ${mastered} zincir ustalaştı · ⏰ ${dueN} zincir bugün tekrar bekliyor</p></section>
 <section class="card"><h2>Kutu dağılımı</h2><p class="muted">Hatasız tamamladıkça kutu yükselir, tekrar süresi uzar.</p>${boxCounts.map((n,b)=>`<div class="section-title"><span class="muted">📦 Kutu ${b}${b===6?' (ustalaştı)':''}</span><span class="badge">${n}</span></div>`).join('')}</section>
 <section class="card"><h2>Zincirler</h2>${chainListHtml()}</section>
 <section class="card"><h2>🔥 ${state.streak.count} günlük seri</h2><p class="muted">Her gün en az bir zincir çalışarak seriyi canlı tut.</p></section>
 <button class="btn ghost" onclick="resetAll()">Tüm ilerlemeyi sıfırla</button>`;
}
function resetAll(){if(confirm('Tüm öğrenme ilerlemesi silinsin mi?')){Store.reset();state=Store.get();studySession=null;drill=null;renderProgress()}}
function render(r,param){({home:renderHome,overview:renderOverview,study:renderStudy,progress:renderProgress,prayer:()=>renderPrayer(param),surah:()=>renderSurah(param)}[r]||renderHome)()}
document.querySelectorAll('.bottom-nav button').forEach(b=>b.onclick=()=>go(b.dataset.route));document.getElementById('themeBtn').onclick=()=>{document.documentElement.classList.toggle('dark');state.theme=document.documentElement.classList.contains('dark')?'dark':'light';Store.set(state)};if(state.theme==='dark')document.documentElement.classList.add('dark');renderHome();
</script>
</body>
