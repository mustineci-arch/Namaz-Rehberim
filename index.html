<html lang="tr">
<head>

  <title>Namaz Rehberim</title>
  
  <style>:root{--bg:#f3f6f5;--card:#fff;--ink:#17211e;--muted:#66746f;--green:#0b5c4a;--green2:#e7f3ee;--line:#dfe8e4;--gold:#b07914;--danger:#a63c3c}
:root.dark{--bg:#101714;--card:#17211d;--ink:#f2f6f4;--muted:#a7b3ae;--green:#58b895;--green2:#203a31;--line:#2d4038;--gold:#e0ad4a;--danger:#e77b7b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.app-header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}h1{font-size:23px;margin:0}.app-header p{margin:3px 0 0;color:var(--muted);font-size:13px}.icon-btn{border:0;border-radius:12px;background:var(--card);color:var(--ink);padding:10px 12px}.app-main{max-width:820px;margin:auto;padding:16px 16px 104px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;gap:5px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}.bottom-nav button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:11px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:18px}.bottom-nav span{font-size:11px;font-weight:700}.bottom-nav button.active{background:var(--green2);color:var(--green)}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.04)}.hero{background:linear-gradient(135deg,var(--green),#178064);color:white}.hero p{color:#eaf7f1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.prayer-card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:15px;text-align:left;color:var(--ink)}.prayer-card strong{display:block;font-size:17px;margin:7px 0 3px}.muted{color:var(--muted);font-size:13px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}.section-title h2{font-size:20px;margin:0}.badge{font-size:12px;border-radius:999px;background:var(--green2);color:var(--green);padding:5px 9px;font-weight:800}.sequence{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:10px 0}.surah-card{min-width:110px;border:1px solid #bddbce;background:var(--green2);color:var(--ink);border-radius:14px;padding:12px;text-align:center;font-weight:800;cursor:pointer}.surah-card small{display:block;margin-bottom:5px;color:var(--muted)}.arrow{color:var(--gold);font-size:21px;font-weight:900}.btn{width:100%;border:0;border-radius:13px;padding:12px 14px;background:var(--green);color:#fff;font-weight:800;margin-top:10px}.btn.secondary{background:var(--green2);color:var(--green)}.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.notice{background:#fff7e7;border-left:4px solid var(--gold);color:#5b461d;padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px}.dark .notice{background:#352b18;color:#f3d99c}.surah-title{font-size:27px;margin:0 0 4px}.arabic{font-family:"Times New Roman",serif;direction:rtl;text-align:right;font-size:29px;line-height:1.9;background:var(--green2);padding:16px;border-radius:14px}.reading{font-size:17px;line-height:1.7}.meaning{font-size:16px;line-height:1.7}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:13px}.tabs button{white-space:nowrap;border:0;border-radius:11px;padding:9px 12px;background:var(--green2);color:var(--green);font-weight:700}.tabs button.active{background:var(--green);color:white}.hidden{display:none!important}.option{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;margin:7px 0}.option.correct{background:#ddf3e6;border-color:#5ea979}.option.wrong{background:#f9e0e0;border-color:#c96969}.progress{height:9px;background:var(--line);border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}table{width:100%;border-collapse:collapse}th,td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}

.audio-panel{background:var(--green2);border:1px solid var(--line);border-radius:15px;padding:13px;margin:14px 0}.audio-main{width:100%;border:0;border-radius:12px;padding:13px;background:var(--green);color:#fff;font-weight:850;font-size:16px}.audio-status{text-align:center;color:var(--muted);font-size:13px;margin:9px 0}.audio-controls{display:flex;justify-content:center;gap:8px}.audio-controls button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 11px;font-weight:700}.audio-controls button.active{background:var(--green);color:white}.audio-progress{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:11px}.audio-progress span{display:block;height:100%;background:var(--green);transition:width .2s linear}
</style>

  </header>

  <main id="app" class="app-main" aria-live="polite"></main>

  </nav>

  <script>window.APP_DATA = {
 plans:[
  {id:'sabah_sunnet',vakit:'Sabah',bolum:'2 Rekât Sünnet',icon:'🌅',sureler:['kafirun','ihlas']},
  {id:'sabah_farz',vakit:'Sabah',bolum:'2 Rekât Farz',icon:'🌅',sureler:['fil','kureys']},
  {id:'ogle_ilk',vakit:'Öğle',bolum:'4 Rekât İlk Sünnet',icon:'☀️',sureler:['maun','kevser','kafirun','nasr']},
  {id:'ogle_farz',vakit:'Öğle',bolum:'4 Rekât Farz',icon:'☀️',sureler:['tebbet','ihlas']},
  {id:'ogle_son',vakit:'Öğle',bolum:'2 Rekât Son Sünnet',icon:'☀️',sureler:['felak','nas']},
  {id:'ikindi_sunnet',vakit:'İkindi',bolum:'4 Rekât Sünnet',icon:'🌤️',sureler:['fil','kureys','maun','kevser']},
  {id:'ikindi_farz',vakit:'İkindi',bolum:'4 Rekât Farz',icon:'🌤️',sureler:['kafirun','nasr']},
  {id:'aksam_farz',vakit:'Akşam',bolum:'3 Rekât Farz',icon:'🌇',sureler:['tebbet','ihlas']},
  {id:'aksam_sunnet',vakit:'Akşam',bolum:'2 Rekât Sünnet',icon:'🌇',sureler:['felak','nas']},
  {id:'yatsi_ilk',vakit:'Yatsı',bolum:'4 Rekât İlk Sünnet',icon:'🌙',sureler:['fil','kureys','maun','kevser']},
  {id:'yatsi_farz',vakit:'Yatsı',bolum:'4 Rekât Farz',icon:'🌙',sureler:['kafirun','nasr']},
  {id:'yatsi_son',vakit:'Yatsı',bolum:'2 Rekât Son Sünnet',icon:'🌙',sureler:['tebbet','ihlas']},
  {id:'vitir',vakit:'Vitir',bolum:'3 Rekât',icon:'⭐',sureler:['ala','kafirun','ihlas']}
 ],
 surahs:{
  kafirun:{number:109,name:'Kâfirûn',arabic:'قُلْ يَا أَيُّهَا الْكَافِرُونَ ۝ لَا أَعْبُدُ مَا تَعْبُدُونَ ۝ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ ۝ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ۝ لَكُمْ دِينُكُمْ وَلِيَ دِينِ',reading:'Kul yâ eyyühel kâfirûn. Lâ a‘büdü mâ ta‘büdûn. Velâ entüm âbidûne mâ a‘büd. Velâ ene âbidün mâ abedtüm. Velâ entüm âbidûne mâ a‘büd. Leküm dînüküm veliye dîn.',meaning:'De ki: Ey inkâr edenler! Ben sizin kulluk ettiklerinize kulluk etmem. Siz de benim kulluk ettiğime kulluk etmezsiniz. Ben sizin kulluk ettiklerinize kulluk edecek değilim. Siz de benim kulluk ettiğime kulluk edecek değilsiniz. Sizin dininiz size, benim dinim banadır.'},
  ihlas:{number:112,name:'İhlâs',arabic:'قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ',reading:'Kul hüvallâhü ehad. Allâhüssamed. Lem yelid ve lem yûled. Ve lem yekün lehû küfüven ehad.',meaning:'De ki: O Allah birdir. Allah sameddir; her şey O’na muhtaçtır, O hiçbir şeye muhtaç değildir. Doğurmamış ve doğmamıştır. Hiçbir şey O’na denk değildir.'},
  fil:{number:105,name:'Fîl',arabic:'أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ ۝ أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ ۝ وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ ۝ تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ ۝ فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ',reading:'Elem tera keyfe feale rabbüke bi-ashâbil fîl. Elem yec‘al keydehüm fî tadlîl. Ve ersele aleyhim tayran ebâbîl. Termîhim bi-hicâratin min siccîl. Fecealehüm ke’asfin me’kûl.',meaning:'Rabbinin fil sahiplerine ne yaptığını görmedin mi? Onların planlarını boşa çıkarmadı mı? Üzerlerine sürü sürü kuşlar gönderdi. Kuşlar onlara pişmiş balçıktan taşlar atıyordu. Sonunda onları yenilmiş ekin yaprakları gibi yaptı.'},
  kureys:{number:106,name:'Kureyş',arabic:'لِإِيلَافِ قُرَيْشٍ ۝ إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ ۝ فَلْيَعْبُدُوا رَبَّ هَذَا الْبَيْتِ ۝ الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ',reading:'Li îlâfi Kureyş. Îlâfihim rihleteş şitâi vessayf. Felya‘büdû rabbe hâzel beyt. Ellezî et‘amehüm min cûin ve âmenehüm min havf.',meaning:'Kureyş’in güvenliği, kış ve yaz yolculuklarındaki güvenlikleri için, kendilerini açlıktan doyuran ve korkudan güvene kavuşturan bu evin Rabbine kulluk etsinler.'},
  maun:{number:107,name:'Mâûn',arabic:'أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ ۝ فَذَلِكَ الَّذِي يَدُعُّ الْيَتِيمَ ۝ وَلَا يَحُضُّ عَلَى طَعَامِ الْمِسْكِينِ ۝ فَوَيْلٌ لِلْمُصَلِّينَ ۝ الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ ۝ الَّذِينَ هُمْ يُرَاءُونَ ۝ وَيَمْنَعُونَ الْمَاعُونَ',reading:'Eraeytellezî yükezzibü biddîn. Fezâlikellezî yedu‘ul yetîm. Velâ yehuddu alâ taâmil miskîn. Feveylün lil musallîn. Ellezîne hüm an salâtihim sâhûn. Ellezîne hüm yürâûn. Ve yemneûnel mâûn.',meaning:'Dini yalanlayanı gördün mü? İşte o, yetimi itip kakar; yoksulu doyurmaya teşvik etmez. Namazlarını ciddiye almayan, gösteriş yapan ve küçük yardımları esirgeyenlerin vay hâline.'},
  kevser:{number:108,name:'Kevser',arabic:'إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ ۝ فَصَلِّ لِرَبِّكَ وَانْحَرْ ۝ إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ',reading:'İnnâ a‘taynâkel kevser. Fesalli lirabbike venhar. İnne şânieke hüvel ebter.',meaning:'Şüphesiz sana Kevser’i verdik. O hâlde Rabbin için namaz kıl ve kurban kes. Asıl soyu kesik olan, sana kin duyandır.'},
  nasr:{number:110,name:'Nasr',arabic:'إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ ۝ وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا ۝ فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا',reading:'İzâ câe nasrullâhi velfeth. Ve raeytennâse yedhulûne fî dînillâhi efvâcâ. Fesebbih bihamdi rabbike vestağfirh. İnnehû kâne tevvâbâ.',meaning:'Allah’ın yardımı ve fetih geldiğinde, insanların bölük bölük Allah’ın dinine girdiğini gördüğünde Rabbini överek tesbih et ve O’ndan bağışlanma dile. Çünkü O, tövbeleri çok kabul edendir.'},
  tebbet:{number:111,name:'Tebbet (Leheb)',arabic:'تَبَّتْ يَدَا أَبِي لَهَبٍ وَتَبَّ ۝ مَا أَغْنَى عَنْهُ مَالُهُ وَمَا كَسَبَ ۝ سَيَصْلَى نَارًا ذَاتَ لَهَبٍ ۝ وَامْرَأَتُهُ حَمَّالَةَ الْحَطَبِ ۝ فِي جِيدِهَا حَبْلٌ مِنْ مَسَدٍ',reading:'Tebbet yedâ ebî lehebin ve tebb. Mâ ağnâ anhü mâlühû ve mâ keseb. Seyaslâ nâran zâte leheb. Vemraetühû hammâletel hatab. Fî cîdihâ hablün min mesed.',meaning:'Ebû Leheb’in elleri kurusun; zaten kurudu. Malı ve kazandıkları ona fayda vermedi. O, alevli bir ateşe girecek; odun taşıyan karısı da. Boynunda bükülmüş liften bir ip olacaktır.'},
  felak:{number:113,name:'Felak',arabic:'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ',reading:'Kul eûzü birabbil felak. Min şerri mâ halak. Ve min şerri gâsikın izâ vekab. Ve min şerrin neffâsâti fil ukad. Ve min şerri hâsidin izâ hased.',meaning:'De ki: Yarattıklarının şerrinden, karanlığı çöktüğünde gecenin şerrinden, düğümlere üfleyenlerin şerrinden ve kıskandığında kıskancın şerrinden sabahın Rabbine sığınırım.'},
  nas:{number:114,name:'Nâs',arabic:'قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ',reading:'Kul eûzü birabbinnâs. Melikinnâs. İlâhinnâs. Min şerril vesvâsil hannâs. Ellezî yüvesvisü fî sudûrinnâs. Minel cinneti vennâs.',meaning:'De ki: İnsanların Rabbine, insanların hükümdarına, insanların ilâhına; insanların kalplerine vesvese veren, sonra sinip geri çekilen cin ve insan şeytanlarının şerrinden sığınırım.'},
  ala:{number:87,name:'A‘lâ',arabic:'سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى ۝ الَّذِي خَلَقَ فَسَوَّى ۝ وَالَّذِي قَدَّرَ فَهَدَى ۝ وَالَّذِي أَخْرَجَ الْمَرْعَى ۝ فَجَعَلَهُ غُثَاءً أَحْوَى',reading:'Sebbihisme rabbikel a‘lâ. Ellezî haleka fesevvâ. Vellezî kaddere fehedâ. Vellezî ahracel mer‘â. Fecealehû gusâen ahvâ…',meaning:'Yüce Rabbinin adını tesbih et. O, yaratıp düzenleyen; ölçü koyup yol gösteren; otlağı çıkarıp sonra onu kapkara kuru çöpe çevirendir. (Bu ekranda sûrenin ilk bölümü özetlenmiştir.)'}
 }
};
</script>
  <script>window.Store={
 get(){try{return JSON.parse(localStorage.getItem('nr_state'))||{learned:{},stats:{total:0,correct:0},theme:'light'}}catch{return {learned:{},stats:{total:0,correct:0},theme:'light'}}},
 set(s){localStorage.setItem('nr_state',JSON.stringify(s))},
 reset(){localStorage.removeItem('nr_state')}
};
</script>
  <script>const D=window.APP_DATA;let state=Store.get();let currentQuiz=null;let route='home';let curParam=null;let surahOrigin=null;
let audioState={audio:null,tracks:[],index:0,playing:false,surahId:null,rate:1};
const AUDIO_SOURCES=[
 n=>`https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/${n}.mp3`,
 n=>`https://server8.mp3quran.net/afs/${n}.mp3`
];

const app=document.getElementById('app');
function sName(id){return D.surahs[id]?.name||id}
function navActive(r){document.querySelectorAll('.bottom-nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===r))}
function go(r,param){if(route==='surah'&&r!=='surah')stopAudio();if(r==='surah'&&route!=='surah')surahOrigin={route,param:curParam};route=r;curParam=param;navActive(['surah','prayer'].includes(r)?'home':r);render(r,param);window.scrollTo({top:0,behavior:'smooth'})}
function surahBack(){if(surahOrigin)go(surahOrigin.route,surahOrigin.param);else go('learn')}
function seq(plan){return `<div class="sequence">${plan.sureler.map((id,i)=>`<button class="surah-card" onclick="go('surah','${id}')"><small>${i+1}. rekât</small>${sName(id)}</button>${i<plan.sureler.length-1?'<span class="arrow">→</span>':''}`).join('')}</div>`}
function renderHome(){const vakitler=[...new Map(D.plans.map(p=>[p.vakit,p])).values()];app.innerHTML=`<section class="card hero"><h2>Bugün 3 dakika çalış</h2><p>Bir vakit seç, sûre sırasını gör, sûreye dokunarak okunuşunu ve anlamını aç.</p></section><div class="grid">${vakitler.map(v=>`<button class="prayer-card" onclick="go('prayer','${v.vakit}')"><span>${v.icon}</span><strong>${v.vakit}</strong><span class="muted">${D.plans.filter(p=>p.vakit===v.vakit).length} bölüm</span></button>`).join('')}</div>`}
function renderPrayer(vakit){const list=D.plans.filter(p=>p.vakit===vakit);app.innerHTML=`<button class="btn ghost" onclick="go('home')">← Ana sayfa</button><div class="section-title"><h2>${list[0].icon} ${vakit}</h2></div>${list.map(p=>`<section class="card"><div class="section-title"><h2>${p.bolum}</h2>${state.learned[p.id]?'<span class="badge">✓ Öğrenildi</span>':''}</div>${seq(p)}<button class="btn" onclick="markLearned('${p.id}')">${state.learned[p.id]?'Tekrar çalış':'Sırayı öğrendim'}</button></section>`).join('')}`}
function renderOverview(){app.innerHTML=`<section class="card"><div class="section-title"><h2>Hızlı Bakış</h2><span class="badge">Tüm vakitler</span></div><table><thead><tr><th>Vakit / bölüm</th><th>Sûre sırası</th></tr></thead><tbody>${D.plans.map(p=>`<tr><td><b>${p.icon} ${p.vakit}</b><br><span class="muted">${p.bolum}</span></td><td>${p.sureler.map((x,i)=>`<button class="surah-card" style="min-width:auto;padding:7px 9px;margin:2px" onclick="go('surah','${x}')">${i+1}. ${sName(x)}</button>`).join(' ')}</td></tr>`).join('')}</tbody></table></section>`}
function renderLearn(){app.innerHTML=`<section class="card"><div class="section-title"><h2>Öğren</h2><span class="badge">${Object.values(state.learned).filter(Boolean).length}/${D.plans.length}</span></div><p class="muted">Sûre kartına dokunarak okunuş ve anlam ekranını aç.</p></section>${D.plans.map(p=>`<section class="card"><div class="section-title"><h2>${p.icon} ${p.vakit}</h2><span class="muted">${p.bolum}</span></div>${seq(p)}<button class="btn ${state.learned[p.id]?'secondary':''}" onclick="markLearned('${p.id}')">${state.learned[p.id]?'✓ Öğrenildi · tekrar et':'Bu sırayı öğrendim'}</button></section>`).join('')}`}
function renderSurah(id){
 const s=D.surahs[id]; stopAudio(false);
 app.innerHTML=`<button class="btn ghost" onclick="surahBack()">← Geri</button>
 <section class="card"><h2 class="surah-title">${s.name} Sûresi</h2><p class="muted">Arapça metin, Türkçe okunuş, anlam ve sesli okuyuş</p>
 <div class="audio-panel">
   <audio id="surahAudio" controls playsinline preload="metadata" style="width:100%"></audio>
   <div class="audio-status" id="audioStatus">Ses yükleniyor…</div>
   <div class="audio-controls">
     <button onclick="restartSurahAudio('${id}')">↺ Baştan</button>
     <button class="speed active" data-rate="1" onclick="setAudioRate(this,1)">1×</button>
     <button class="speed" data-rate="0.75" onclick="setAudioRate(this,.75)">0,75×</button>
   </div>
   <a id="audioFallback" class="btn ghost" target="_blank" rel="noopener" style="margin-top:10px">Ses kaynağını ayrı aç</a>
 </div>
 <div class="tabs"><button class="active" onclick="tab(this,'arabicTab')">Arapça</button><button onclick="tab(this,'readingTab')">Okunuş</button><button onclick="tab(this,'meaningTab')">Anlam</button></div>
 <div id="arabicTab" class="tab-pane arabic">${s.arabic}</div><div id="readingTab" class="tab-pane reading hidden">${s.reading}</div><div id="meaningTab" class="tab-pane meaning hidden">${s.meaning}</div></section>
 <section class="notice">Türkçe okunuş yalnızca yardımcıdır. Sesli okuyuş çevrim içi Kur’an ses servisinden alınır.</section>`; setTimeout(()=>loadSurahAudio(id),0)}
function loadSurahAudio(id){
 const s=D.surahs[id];
 if(!s?.number) throw new Error('Sûre numarası bulunamadı.');
 const n=String(s.number).padStart(3,'0');
 audioState.tracks=AUDIO_SOURCES.map(f=>f(n));audioState.index=0;audioState.surahId=id;
 const audio=document.getElementById('surahAudio');
 if(!audio)return;
 audio.playbackRate=audioState.rate; audioState.audio=audio;
 audio.oncanplay=()=>setAudioStatus('Ses hazır. Oynat düğmesine dokun.');
 audio.onloadstart=()=>setAudioStatus('Ses yükleniyor…');
 audio.onplay=()=>setAudioStatus('Oynatılıyor.');
 audio.onpause=()=>{if(!audio.ended)setAudioStatus('Duraklatıldı.');};
 audio.onended=()=>setAudioStatus('Sûre tamamlandı.');
 audio.onerror=()=>{
  if(audioState.index<audioState.tracks.length-1){audioState.index++;setAudioStatus('Bu kaynak açılmadı, başka bir sunucu deneniyor…');playCurrentTrack()}
  else setAudioStatus('Ses hiçbir kaynaktan yüklenemedi. “Ses kaynağını ayrı aç” düğmesini dene.');
 };
 playCurrentTrack();
}
function playCurrentTrack(){
 const audio=audioState.audio;const url=audioState.tracks[audioState.index];
 const fallback=document.getElementById('audioFallback');
 if(!audio||!url)return;
 audio.src=url;
 if(fallback)fallback.href=url;
}
function setAudioStatus(text){const el=document.getElementById('audioStatus');if(el)el.textContent=text}
function toggleSurahAudio(id){
 const audio=document.getElementById('surahAudio');
 if(!audioState.surahId)loadSurahAudio(id);
 const a=audioState.audio||audio;
 if(!a)return;
 if(a.paused)a.play().catch(()=>setAudioStatus('iPhone yerel dosya güvenliği sesi engelledi. Alttaki bağlantıyla aç.'));else a.pause();
}
function restartSurahAudio(id){const a=audioState.audio||document.getElementById('surahAudio');if(!a){loadSurahAudio(id);return}a.currentTime=0;a.play().catch(()=>setAudioStatus('Ses ayrı bağlantıda açılmalı.'))}
function setAudioRate(btn,rate){audioState.rate=rate;if(audioState.audio)audioState.audio.playbackRate=rate;document.querySelectorAll('.speed').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function stopAudio(clear=true){if(audioState.audio){audioState.audio.pause()}audioState.audio=null;audioState.playing=false;if(clear){audioState.tracks=[];audioState.index=0;audioState.surahId=null}}
function tab(btn,id){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.tab-pane').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function markLearned(id){state.learned[id]=true;Store.set(state);render(route,route==='prayer'?D.plans.find(p=>p.id===id).vakit:null)}
function eligible(){return D.plans.filter(p=>state.learned[p.id])}
function newQuestion(){const e=eligible();if(!e.length)return null;const p=e[Math.floor(Math.random()*e.length)],i=Math.floor(Math.random()*p.sureler.length);let q,a;if(i<p.sureler.length-1&&Math.random()>.35){q=`${sName(p.sureler[i])} sûresinden sonra hangisi gelir?`;a=p.sureler[i+1]}else{q=`${p.vakit} – ${p.bolum} bölümünde ${i+1}. rekâtta hangi sûre var?`;a=p.sureler[i]}const pool=[...new Set(Object.keys(D.surahs))].filter(x=>x!==a).sort(()=>Math.random()-.5).slice(0,3);return{p,q,a,opts:[...pool,a].sort(()=>Math.random()-.5)}}
function renderQuiz(){const e=eligible();if(!e.length){app.innerHTML=`<section class="card"><h2>Quiz kilitli</h2><p>Önce Öğren bölümünden en az bir sûre sırasını “öğrendim” olarak işaretle.</p><button class="btn" onclick="go('learn')">Öğren bölümüne git</button></section>`;return}currentQuiz=newQuestion();app.innerHTML=`<section class="card"><div class="section-title"><h2>Quiz</h2><span class="badge">${state.stats.correct}/${state.stats.total}</span></div><p class="muted">${currentQuiz.p.icon} ${currentQuiz.p.vakit} · ${currentQuiz.p.bolum}</p><h3>${currentQuiz.q}</h3><div id="opts">${currentQuiz.opts.map(o=>`<button class="option" onclick="answer(this,'${o}')">${sName(o)}</button>`).join('')}</div><button id="nextQ" class="btn hidden" onclick="renderQuiz()">Sonraki soru</button></section>`}
function answer(btn,val){document.querySelectorAll('.option').forEach(b=>b.disabled=true);state.stats.total++;if(val===currentQuiz.a){state.stats.correct++;btn.classList.add('correct')}else{btn.classList.add('wrong');document.querySelectorAll('.option').forEach(b=>{if(b.textContent===sName(currentQuiz.a))b.classList.add('correct')})}Store.set(state);document.getElementById('nextQ').classList.remove('hidden')}
function renderProgress(){const learned=Object.values(state.learned).filter(Boolean).length,pct=D.plans.length?Math.round(learned/D.plans.length*100):0,acc=state.stats.total?Math.round(state.stats.correct/state.stats.total*100):0;app.innerHTML=`<section class="card"><h2>İlerleme</h2><p><b>${learned}/${D.plans.length}</b> bölüm öğrenildi</p><div class="progress"><span style="width:${pct}%"></span></div></section><section class="card"><h2>Quiz başarısı</h2><p><b>%${acc}</b> · ${state.stats.correct} doğru / ${state.stats.total} soru</p></section><button class="btn ghost" onclick="resetAll()">Tüm ilerlemeyi sıfırla</button>`}
function resetAll(){if(confirm('Tüm öğrenme ve quiz kayıtları silinsin mi?')){Store.reset();state=Store.get();renderProgress()}}
function render(r,param){({home:renderHome,overview:renderOverview,learn:renderLearn,quiz:renderQuiz,progress:renderProgress,prayer:()=>renderPrayer(param),surah:()=>renderSurah(param)}[r]||renderHome)()}
document.querySelectorAll('.bottom-nav button').forEach(b=>b.onclick=()=>go(b.dataset.route));document.getElementById('themeBtn').onclick=()=>{document.documentElement.classList.toggle('dark');state.theme=document.documentElement.classList.contains('dark')?'dark':'light';Store.set(state)};if(state.theme==='dark')document.documentElement.classList.add('dark');renderHome();
</script>
</body>
</html>
